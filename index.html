<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데일리북</title>
<meta name="description" content="오늘치 데일리북을 보낼지 결정하는 버튼">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3ede2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="데일리북">
<style>
:root{
  --bg:#f3ede2; --card:#fffdf8; --ink:#2e2a25; --dim:#877e70; --line:#e2d9c8;
  --accent:#7a4f34; --accent-ink:#fdf8f0; --ok:#3f6b5a; --bad:#a4432f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1714; --card:#241f1b; --ink:#eae2d6; --dim:#9b9083; --line:#3a332c;
    --accent:#c08a61; --accent-ink:#20180f; --ok:#7fb59c; --bad:#e08a74;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:460px; margin:0 auto; padding:24px 20px;
  padding-top:calc(24px + env(safe-area-inset-top));
  padding-bottom:calc(32px + env(safe-area-inset-bottom));
}
header{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px}
.brand{font-size:15px; font-weight:700; letter-spacing:.12em; color:var(--dim)}
.icon-btn{
  background:none; border:0; padding:6px; color:var(--dim);
  font-size:18px; cursor:pointer; line-height:1; border-radius:8px;
}
.icon-btn:hover{background:var(--line)}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:22px; margin-bottom:18px;
}
.badge{
  display:inline-block; font-size:12px; font-weight:700; letter-spacing:.08em;
  padding:4px 10px; border-radius:999px; color:var(--accent-ink); background:var(--accent);
}
.badge.문학{background:#8a5a3b} .badge.철학{background:#4a5d7e} .badge.과학{background:#3f6b5a}
.badge.문학,.badge.철학,.badge.과학{color:#fdf8f0}
.author{margin:14px 0 2px; font-size:13px; color:var(--dim)}
.title{
  margin:0; font-size:27px; line-height:1.3; font-weight:600; letter-spacing:-.01em;
  font-family:"Nanum Myeongjo","Apple SD Gothic Neo",Batang,바탕,serif;
  word-break:keep-all;
}
.title a{color:inherit; text-decoration:none; border-bottom:1px solid var(--line)}
.meta{margin:16px 0 0; font-size:14px; color:var(--dim)}
.meta b{color:var(--ink); font-weight:600}
.bar{height:4px; border-radius:999px; background:var(--line); margin-top:14px; overflow:hidden}
.bar>i{display:block; height:100%; background:var(--accent); border-radius:999px}

button.go{
  display:block; width:100%; padding:21px; border:0; border-radius:16px;
  background:var(--accent); color:var(--accent-ink);
  font-size:18px; font-weight:700; letter-spacing:.02em; font-family:inherit;
  cursor:pointer; transition:transform .08s, opacity .15s;
}
button.go:active{transform:scale(.985)}
button.go:disabled{opacity:.45; cursor:default; transform:none}
button.go.quiet{background:var(--line); color:var(--dim)}

.status{margin:16px 2px 0; font-size:14.5px; min-height:22px; color:var(--dim); word-break:keep-all}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.status a{color:inherit}
.sub{margin:10px 2px 0; font-size:13px; color:var(--dim)}
.sub a,.linkbtn{color:var(--dim); text-decoration:underline; background:none; border:0; padding:0;
  font:inherit; font-size:13px; cursor:pointer}
footer{margin-top:26px; font-size:12.5px; color:var(--dim); line-height:1.8}
footer a{color:var(--dim)}

.dots::after{content:"…"; animation:d 1.3s ease-in-out infinite}
@keyframes d{0%,100%{opacity:.25}50%{opacity:1}}

label{display:block; font-size:13px; color:var(--dim); margin:0 0 8px}
input[type=password],input[type=text]{
  width:100%; padding:14px; font:15px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:12px;
}
ol{margin:12px 0 0; padding-left:20px; font-size:14px; color:var(--dim)}
ol li{margin:7px 0; word-break:keep-all}
ol b{color:var(--ink)}
code{font:13px ui-monospace,SFMono-Regular,Consolas,monospace; background:var(--bg);
  padding:1px 5px; border-radius:5px; border:1px solid var(--line)}
.skel{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">📚 데일리북</span>
    <button class="icon-btn" id="gear" title="토큰 설정" hidden>⚙</button>
  </header>
  <div id="view"><p class="skel">불러오는 중<span class="dots"></span></p></div>
  <noscript><p>자바스크립트를 켜야 동작합니다.</p></noscript>
</div>

<script>
const OWNER = 'reepower84-png', REPO = 'daily-book', WORKFLOW = 'send.yml', REF = 'main';
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const KEY = 'dailybook.token';

const $ = s => document.querySelector(s);
const view = $('#view'), gear = $('#gear');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 날짜는 전부 한국 시간 기준 — 서버(progress.json)와 같은 잣대여야 '오늘 보냈는지'가 맞는다
const KST = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'});
const 오늘 = () => KST.format(new Date());
const 요일 = ['일','월','화','수','목','금','토'];
const 날짜 = ymd => {
  const d = new Date(ymd + 'T12:00:00Z');
  return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 (${요일[d.getUTCDay()]})`;
};
const 며칠전 = ymd => Math.round((new Date(오늘()) - new Date(ymd)) / 86400000);

let token = localStorage.getItem(KEY) || '';
let 상태 = null;   // { next, progress }

class GhError extends Error {
  constructor(msg, 토큰문제 = false) { super(msg); this.토큰문제 = 토큰문제; }
}

async function gh(path, opts = {}) {
  let res;
  try {
    res = await fetch(API + path, {
      cache: 'no-store',
      ...opts,
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + token,
        'X-GitHub-Api-Version': '2022-11-28',
        ...(opts.headers || {}),
      },
    });
  } catch {
    throw new GhError('GitHub에 연결하지 못했습니다. 네트워크를 확인해 주세요.');
  }
  if (res.status === 401) throw new GhError('토큰이 만료됐거나 잘못됐습니다. 새로 발급해 주세요.', true);
  if (res.status === 403) throw new GhError('토큰 권한이 모자랍니다 — Actions를 “Read and write”로 주셔야 합니다.', true);
  if (res.status === 404) throw new GhError('저장소를 찾지 못했습니다. 토큰이 daily-book 저장소를 포함하는지 확인해 주세요.', true);
  if (!res.ok) throw new GhError(`GitHub 응답 ${res.status} ${res.statusText}`);
  return res;
}
const 읽기 = async path =>
  JSON.parse(await (await gh(`/contents/${path}?ref=${REF}`, {headers:{'Accept':'application/vnd.github.raw'}})).text());

// ── 화면 ────────────────────────────────────────────────
function 토큰화면(안내 = '') {
  gear.hidden = true;
  view.innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 6px; font-size:19px">처음 한 번만 설정</h2>
      <p class="sub" style="margin:0 0 18px">${안내 || '이 버튼이 GitHub에 발송을 시킬 수 있도록, 권한 토큰을 한 번 넣어 주세요.<br>토큰은 이 기기 안에만 저장되고 어디에도 전송되지 않습니다.'}</p>
      <label for="tk">GitHub 토큰</label>
      <input id="tk" type="password" placeholder="github_pat_… 붙여넣기" autocomplete="off" spellcheck="false">
      <p class="status" id="st"></p>
      <button class="go" id="save" style="margin-top:12px">저장하고 시작</button>
      <ol>
        <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 발급 페이지</a>를 엽니다 (아래 링크)</li>
        <li>Repository access → <b>Only select repositories</b> → <code>daily-book</code></li>
        <li>Permissions → Repository permissions에서<br>
            <b>Actions</b> = Read and write, <b>Contents</b> = Read-only</li>
        <li>Expiration은 <b>No expiration</b> 또는 1년을 권합니다</li>
        <li>만들어진 <code>github_pat_…</code> 를 위에 붙여넣기</li>
      </ol>
      <p class="sub" style="margin-top:16px">
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">→ 토큰 발급하러 가기</a>
      </p>
    </div>`;
  $('#tk').focus();
  $('#save').onclick = async () => {
    const v = $('#tk').value.trim();
    if (!v) return;
    const btn = $('#save'), st = $('#st');
    btn.disabled = true; st.className = 'status'; st.innerHTML = '확인하는 중<span class="dots"></span>';
    token = v;
    try {
      await 읽기('data/progress.json');
      localStorage.setItem(KEY, token);
      본화면();
    } catch (e) {
      token = '';
      st.className = 'status bad'; st.textContent = e.message;
      btn.disabled = false;
    }
  };
}

function 카드(next, progress) {
  const 보냄 = progress.streak.lastDate === 오늘();
  const 마지막 = progress.streak.lastDate;
  const 쉰날 = 마지막 ? 며칠전(마지막) : null;
  const 쉼 = 마지막 === null ? '아직 시작 전'
    : 쉰날 === 0 ? '오늘 읽음'
    : 쉰날 === 1 ? '어제 읽음'
    : `${쉰날}일 쉬는 중`;
  const 비율 = Math.round(next.shelf.번째 / next.shelf.전체 * 1000) / 10;

  return `
    <div class="card">
      <span class="badge ${esc(next.category)}">${esc(next.category)}</span>
      <p class="author">${esc(next.author)}</p>
      <h1 class="title"><a href="${esc(next.url)}" target="_blank" rel="noopener">${esc(next.title.split('/').pop())}</a></h1>
      <p class="meta">
        보내면 <b>${next.pages}쪽</b> · <b>${next.day}일째</b> · ${next.이어읽기 ? '이어읽기' : '새 글'}<br>
        ${esc(next.category)} 서가 ${next.shelf.번째}/${next.shelf.전체}편
      </p>
      <div class="bar"><i style="width:${Math.max(비율, 0.6)}%"></i></div>
    </div>
    <button class="go${보냄 ? ' quiet' : ''}" id="go">${보냄 ? '오늘은 이미 보냈습니다' : '오늘치 보내기'}</button>
    <p class="status" id="st"></p>
    ${보냄 ? '<p class="sub"><button class="linkbtn" id="force">그래도 한 번 더 보내기</button></p>' : ''}
    <footer>
      ${esc(쉼)} · 누적 ${progress.totals.days}일 · ${progress.totals.chars.toLocaleString()}자 · 연속 ${progress.streak.current}일<br>
      ${마지막 ? `마지막으로 읽은 날 ${날짜(마지막)}` : `시작 예정일 ${날짜(progress.startedAt)}`}
    </footer>`;
}

async function 본화면() {
  gear.hidden = false;
  view.innerHTML = '<p class="skel">불러오는 중<span class="dots"></span></p>';
  try {
    const [next, progress] = await Promise.all([읽기('data/next.json'), 읽기('data/progress.json')]);
    상태 = { next, progress };
    그리기();
  } catch (e) {
    if (e.토큰문제) return 토큰화면(`${esc(e.message)}`);
    view.innerHTML = `<div class="card"><p class="status bad">${esc(e.message)}</p></div>
      <button class="go" onclick="location.reload()">다시 시도</button>`;
  }
}

function 그리기() {
  const { next, progress } = 상태;
  view.innerHTML = 카드(next, progress);
  const 보냄 = progress.streak.lastDate === 오늘();
  $('#go').onclick = () => 보냄 ? null : 보내기(false);
  if (보냄) $('#go').disabled = true;
  const f = $('#force'); if (f) f.onclick = () => 보내기(true);
}

function 알리기(msg, kind = '') {
  const st = $('#st'); if (!st) return;
  st.className = 'status' + (kind ? ' ' + kind : '');
  st.innerHTML = msg;
}

// ── 발송 ────────────────────────────────────────────────
async function 보내기(force) {
  const go = $('#go'), f = $('#force');
  go.disabled = true; if (f) f.disabled = true;
  go.textContent = '보내는 중…';
  알리기('발송을 요청했습니다<span class="dots"></span>');

  const 시각 = Date.now();
  try {
    await gh(`/actions/workflows/${WORKFLOW}/dispatches`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ ref: REF, inputs: force ? { force: 'true' } : {} }),
    });
  } catch (e) {
    go.disabled = false; go.textContent = '다시 보내기';
    return 알리기(esc(e.message), 'bad');
  }
  await 지켜보기(시각, go);
}

/** 방금 띄운 실행을 찾아 끝날 때까지 지켜본다. 디스패치 직후엔 목록에 없을 수 있어 잠시 기다린다. */
async function 지켜보기(시각, go) {
  for (let i = 0; i < 75; i++) {                       // 4초 × 75 ≈ 5분
    await sleep(4000);
    let runs;
    try {
      ({ workflow_runs: runs } = await (await gh(`/actions/workflows/${WORKFLOW}/runs?per_page=5`)).json());
    } catch { continue; }                              // 일시적 실패는 그냥 다음 차례에
    const run = runs.find(r => new Date(r.created_at).getTime() >= 시각 - 20000);
    if (!run) { 알리기('실행을 기다리는 중<span class="dots"></span>'); continue; }
    if (run.status !== 'completed') {
      알리기(run.status === 'queued' ? '차례를 기다리는 중<span class="dots"></span>' : '본문을 모으는 중<span class="dots"></span>');
      continue;
    }
    if (run.conclusion === 'success') return 성공(go, run);
    go.textContent = '다시 보내기'; go.disabled = false;
    return 알리기(`발송에 실패했습니다 — <a href="${esc(run.html_url)}" target="_blank" rel="noopener">기록 보기</a>`, 'bad');
  }
  go.textContent = '다시 보내기'; go.disabled = false;
  알리기(`아직 끝나지 않았습니다. <a href="https://github.com/${OWNER}/${REPO}/actions" target="_blank" rel="noopener">GitHub에서 확인</a>`, 'bad');
}

async function 성공(go, run) {
  go.textContent = '보냈습니다 ✓';
  알리기('메일함을 확인해 주세요.', 'ok');
  // 진도 커밋이 반영될 때까지 잠깐 기다렸다가 화면을 새로 맞춘다
  for (let i = 0; i < 6; i++) {
    await sleep(2500);
    try {
      const progress = await 읽기('data/progress.json');
      if (progress.streak.lastDate === 오늘()) {
        상태.progress = progress;
        try { 상태.next = await 읽기('data/next.json'); } catch {}
        그리기();
        알리기('메일을 보냈습니다. 메일함을 확인해 주세요.', 'ok');
        return;
      }
    } catch {}
  }
}

gear.onclick = () => {
  if (!confirm('저장된 토큰을 지우고 다시 넣으시겠습니까?')) return;
  localStorage.removeItem(KEY); token = '';
  토큰화면();
};

token ? 본화면() : 토큰화면();
</script>
</body>
</html>
